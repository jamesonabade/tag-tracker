<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app_title">Tag Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="static/style.css">
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <div class="panel-head">
    <div class="brand"><span class="dot"></span> Tag Tracker</div>
    <select id="langSelect" class="lang-select" title="Idioma / Language" aria-label="Idioma">
      <option value="pt-BR">PT</option>
      <option value="en">EN</option>
    </select>
    <span id="sync" class="sync-badge off" title="Google Drive sync" data-i18n="sync_drive">Drive</span>
    <button id="pro" class="sync-badge off" hidden title="Unlock Pro" data-i18n="pro_free">🔒 Free</button>
    <button id="toggle" class="icon" title="Hide panel" data-i18n-title="toggle_panel">▾</button>
  </div>

  <div class="panel-body">
    <label class="field"><span data-i18n="label_tag">Tag</span>
      <select id="device"></select>
    </label>
    <div id="latest" class="latest"></div>
    <button id="park" class="park" data-i18n="park_btn_idle">🅿️ Park &amp; guard</button>
    <div class="row">
      <button id="locate" class="primary" data-i18n="locate_now">📍 Locate now</button>
      <button id="ring" data-i18n="ring">🔔 Ring</button>
      <button id="share" data-i18n="share">↗ Share</button>
    </div>

    <div class="field"><span data-i18n="history_label">History</span>
      <div class="chips" id="ranges">
        <button data-h="today" data-i18n="range_today">Today</button>
        <button data-h="24">24 h</button>
        <button data-h="48" data-i18n="range_2d">2 days</button>
        <button data-h="168" class="on" data-i18n="range_7d">7 days</button>
        <button data-h="720" data-i18n="range_30d">30 days</button>
        <button data-h="2160" data-i18n="range_90d">90 days</button>
        <button data-h="8760" data-i18n="range_1y">1 year</button>
        <button data-h="custom" data-i18n="range_custom">Custom</button>
      </div>
    </div>
    <div id="custom" class="custom" hidden>
      <label><span data-i18n="custom_from">From</span><input type="datetime-local" id="from"></label>
      <label><span data-i18n="custom_to">To</span><input type="datetime-local" id="to"></label>
      <button id="applyCustom" data-i18n="custom_show">Show</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="field"><span data-i18n="playback_label">Playback</span>
      <div class="playback">
        <button id="play" class="icon" title="Play">▶</button>
        <input type="range" id="scrub" min="0" max="0" value="0">
      </div>
      <div class="muted small" id="scrubLabel">&nbsp;</div>
    </div>

    <label class="check"><input type="checkbox" id="showPoints" checked> <span data-i18n="show_points">Show individual points</span></label>
    <label class="check"><input type="checkbox" id="autoRefresh" checked> <span data-i18n="auto_refresh">Auto-refresh every minute</span></label>

    <div class="row">
      <button id="pollNow" data-i18n="check_now">Check now</button>
      <button id="csv">CSV</button>
      <button id="gpx">GPX</button>
    </div>
    <div class="muted small" id="pollStatus"></div>
    <div class="row foot">
      <button id="rename" class="link" data-i18n="rename_tag">Rename tag</button>
      <button id="server" class="link" hidden data-i18n="change_server">Change server</button>
      <button id="logout" class="link">Configurações</button>
    </div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="static/i18n.js"></script>
<script src="static/app.js"></script>
</body>
</html>
