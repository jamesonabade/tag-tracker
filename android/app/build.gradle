plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def signingProperties = new Properties()
def signingPropertiesFile = file("../signing.properties")
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: signingProperties.getProperty(propName)
}
def ks = signingValue("ANDROID_KEYSTORE_PATH", "storeFile")
def ksStorePassword = signingValue("ANDROID_KEYSTORE_PASSWORD", "storePassword")
def ksAlias = signingValue("ANDROID_KEY_ALIAS", "keyAlias")
def ksKeyPassword = signingValue("ANDROID_KEY_PASSWORD", "keyPassword")
def officialSigningReady = ks && ksStorePassword && ksAlias && ksKeyPassword && file(ks).isFile()
def repoRoot = file("../..")
def gfmtDir = new File(repoRoot, "vendor/GoogleFindMyTools")
def genPy = layout.buildDirectory.dir("sharedCode/serverpy").get().asFile
def genWeb = layout.buildDirectory.dir("sharedCode/webassets").get().asFile
// Must exist at configuration time because Chaquopy / assets register them as source dirs.
genPy.mkdirs()
genWeb.mkdirs()

// VERSION is the single source for both GitHub Actions and Android Studio.
def verFile = file("${repoRoot}/VERSION")
if (!verFile.isFile()) throw new GradleException("VERSION file is missing")
def defaultVersion = verFile.text.trim()
if (!(defaultVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("VERSION must have MAJOR.MINOR.PATCH (e.g. 3.23.3)")
}
def versionNumbers = defaultVersion.tokenize(".").collect { it.toInteger() }
if (versionNumbers[1] >= 100 || versionNumbers[2] >= 100) {
    throw new GradleException("VERSION minor and patch components must be < 100")
}
def defaultVersionCode = versionNumbers[0] * 10000 + versionNumbers[1] * 100 + versionNumbers[2]

android {
    namespace "com.tagtracker.app"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.tagtracker.app"
        minSdk 24
        targetSdk 35
        versionCode defaultVersionCode
        versionName defaultVersion
        ndk { abiFilters "arm64-v8a" }  // real phones only; drops x86_64 emulator libs (~half the size)
    }

    signingConfigs {
        if (officialSigningReady) {
            official {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (officialSigningReady) signingConfig signingConfigs.official
        }
        release {
            minifyEnabled true       // R8: shrink + obfuscate the APK
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Official releases must never use a temporary debug signature.
            if (officialSigningReady) signingConfig signingConfigs.official
        }
    }

    sourceSets {
        main { assets.srcDirs += genWeb }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip { install "-r", "requirements-android.txt" }
        extractPackages "certifi"
    }
    sourceSets {
        main {
            srcDir "src/main/python"
            srcDir genPy
            srcDir gfmtDir
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!officialSigningReady) throw new GradleException(
            "Official Release requires ANDROID_KEYSTORE_* or android/signing.properties")
    }
}
tasks.matching { it.name in ["assembleRelease", "bundleRelease"] }.configureEach {
    dependsOn "verifyReleaseSigning"
}

// Share the server's Python code and the web UI with the app instead of duplicating them.
tasks.register("copySharedCode", Copy) {
    from(new File(repoRoot, "server")) { include "*.py"; into "serverpy/server" }
    from(new File(repoRoot, "web")) { into "webassets/web" }
    into layout.buildDirectory.dir("sharedCode")
    doFirst {
        if (!new File(gfmtDir, "NovaApi").exists()) {
            throw new GradleException("Missing ${gfmtDir}. Run setup.ps1 / setup.sh (or clone GoogleFindMyTools there) first.")
        }
    }
}
preBuild.dependsOn "copySharedCode"
// The Python source-merge / proxy tasks and asset merge read the generated dirs, so make
// them wait for the copy (avoids Gradle's implicit-dependency error).
tasks.matching {
    it.name ==~ /(?i)(merge|generate).*Python.*|merge.*Assets/
}.configureEach { dependsOn "copySharedCode" }

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.webkit:webkit:1.12.1"
}
