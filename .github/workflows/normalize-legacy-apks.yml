name: Padronizar assinatura das releases antigas (execucao unica)

on:
  push:
    branches: [main]
    paths: [".github/workflows/normalize-legacy-apks.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "3.23.1", code: "32301" }
          - { version: "3.23.2", code: "32302" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ matrix.version }}
          path: legacy
          persist-credentials: false

      - name: Prepare original pinned dependency
        working-directory: legacy
        run: |
          set -euo pipefail
          git clone https://github.com/leonboe1/GoogleFindMyTools vendor/GoogleFindMyTools
          git -C vendor/GoogleFindMyTools checkout d46e9528578015b51d3b84dd91bf8f16e9ab850f
          for p in vendor-patches/*.patch; do
            git -C vendor/GoogleFindMyTools apply "$GITHUB_WORKSPACE/legacy/$p"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore and validate permanent signing key
        env:
          BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf %s "$BASE64" | base64 -d > "$RUNNER_TEMP/tagtracker-release.p12"
          chmod 600 "$RUNNER_TEMP/tagtracker-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/tagtracker-release.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          actual="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/tagtracker-release.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "1978c80be9e86c3c8bb34b12d8acff4d2c6dfb2e6949625d35e4d22c5f92d22b" || { echo "::error::Certificate mismatch"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tagtracker-release.p12" >> "$GITHUB_ENV"

      - name: Rebuild original tag with permanent signing and correct version
        working-directory: legacy/android
        env:
          VERSION_CODE: ${{ matrix.code }}
          VERSION_NAME: ${{ matrix.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify package version code and official signing fingerprint
        env:
          VERSION_NAME: ${{ matrix.version }}
          VERSION_CODE: ${{ matrix.code }}
        run: |
          set -euo pipefail
          apk=legacy/android/app/build/outputs/apk/release/app-release.apk
          buildtools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          tools="$ANDROID_HOME/build-tools/$buildtools"
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/verified.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/verified.txt" | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "1978c80be9e86c3c8bb34b12d8acff4d2c6dfb2e6949625d35e4d22c5f92d22b" || { echo "::error::Invalid APK signature"; exit 1; }
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          head -n1 "$RUNNER_TEMP/badging.txt" > "$RUNNER_TEMP/package.txt"
          cat "$RUNNER_TEMP/package.txt"
          grep -F "name='com.tagtracker.app'" "$RUNNER_TEMP/package.txt"
          grep -F "versionCode='$VERSION_CODE'" "$RUNNER_TEMP/package.txt"
          grep -F "versionName='$VERSION_NAME'" "$RUNNER_TEMP/package.txt"
          mkdir -p staged
          cp "$apk" "staged/TagTracker-v$VERSION_NAME.apk"

      - name: Stage verified old-version APK
        uses: actions/upload-artifact@v4
        with:
          name: verified-legacy-v${{ matrix.version }}
          path: staged/TagTracker-v${{ matrix.version }}.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both verified old versions
        uses: actions/download-artifact@v4
        with:
          pattern: verified-legacy-v*
          merge-multiple: true
          path: staged

      - name: Back up existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s staged/TagTracker-v3.23.1.apk
          test -s staged/TagTracker-v3.23.2.apk
          for v in 3.23.1 3.23.2; do
            mkdir -p "backup/v$v"
            gh release download "v$v" --repo "$GITHUB_REPOSITORY" --pattern TagTracker.apk --dir "backup/v$v"
            test -s "backup/v$v/TagTracker.apk"
            echo "Original v$v: $(sha256sum "backup/v$v/TagTracker.apk")"
          done

      - name: Save old APK backups for audit
        uses: actions/upload-artifact@v4
        with:
          name: original-apks-before-resigning
          path: backup/
          retention-days: 90
          if-no-files-found: error

      - name: Replace releases only after both builds and backup succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for v in 3.23.1 3.23.2; do
            mkdir -p "publish/v$v"
            cp "staged/TagTracker-v$v.apk" "publish/v$v/TagTracker.apk"
            gh release upload "v$v" "publish/v$v/TagTracker.apk" "staged/TagTracker-v$v.apk" --clobber --repo "$GITHUB_REPOSITORY"
            expected="sha256:$(sha256sum "publish/v$v/TagTracker.apk" | cut -d ' ' -f1)"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$v" --jq '.assets[] | select(.name == "TagTracker.apk") | .digest')"
            test "$actual" = "$expected" || { echo "::error::Digest mismatch for v$v"; exit 1; }
            echo "Published and verified v$v: $actual"

            marker="APK republicado com assinatura permanente"
            existing="$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if ! printf '%s' "$existing" | grep -Fq "$marker"; then
              if [ "$v" = "3.23.1" ]; then code=32301; else code=32302; fi
              printf '%s\n\n---\n\n**%s (10/11/2026).**\nRecompilado a partir da tag original com a chave oficial do Tag Tracker, sem modificar as tags ou os commits. versionCode: %s.\n' "$existing" "$marker" "$code" > "publish/v$v/notes.md"
              gh release edit "v$v" --repo "$GITHUB_REPOSITORY" --notes-file "publish/v$v/notes.md"
            fi
          done

      - name: Add version-named APK to current official v3.23.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.23.3 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "TagTracker-v3.23.3.apk"; then
            echo "Current version-named APK already exists"
            exit 0
          fi
          mkdir -p current
          gh release download v3.23.3 --repo "$GITHUB_REPOSITORY" --pattern TagTracker.apk --dir current
          test -s current/TagTracker.apk
          cp current/TagTracker.apk current/TagTracker-v3.23.3.apk
          gh release upload v3.23.3 current/TagTracker-v3.23.3.apk --repo "$GITHUB_REPOSITORY"
