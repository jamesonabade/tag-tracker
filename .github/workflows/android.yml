name: Android APK

on:
  push:
    branches: [main, fix/sincronizar-tags-removidas]
    paths: ["android/**", "web/**", "server/**", "VERSION", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "::error::Tag must match VERSION"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release must be on main"; exit 1; }

      - name: Fetch GoogleFindMyTools (bundled into the APK)
        run: |
          git clone https://github.com/leonboe1/GoogleFindMyTools vendor/GoogleFindMyTools
          git -C vendor/GoogleFindMyTools checkout d46e9528578015b51d3b84dd91bf8f16e9ab850f
          # Apply our FCM/location reliability fixes on top of the pinned commit.
          for p in vendor-patches/*.patch; do
            echo "Applying $p"
            git -C vendor/GoogleFindMyTools apply "$GITHUB_WORKSPACE/$p"
          done
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore official signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Permanent APK signing secrets are missing. Release builds are disabled."
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tagtracker-release.p12"
          chmod 600 "$RUNNER_TEMP/tagtracker-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/tagtracker-release.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tagtracker-release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          # Gradle derives versionCode/versionName from the root VERSION file.
          # Never use github.run_number as versionCode: it can be lower than installed APKs.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TagTracker.apk || cp app/build/outputs/apk/release/*-release*.apk TagTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TagTracker-apk
          path: |
            android/TagTracker.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/TagTracker.apk
