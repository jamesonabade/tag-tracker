name: Publicar APK unico v3.23.4 e remover duplicatas (uso unico)

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-single-apk-v3.23.4.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tested APK and version before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED_SHA="f289a5875c1ce8d742cf475bc0c68e9a5c87a63f"
          SOURCE_RUN="42803086152"
          test "$(cat VERSION)" = "3.23.4"
          git merge-base --is-ancestor "$TESTED_SHA" HEAD
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = "success"

      - name: Download single signed APK from successful main build
        uses: actions/download-artifact@v4
        with:
          name: TagTracker-v3.23.4-signed-apk
          run-id: 42803086152
          github-token: ${{ github.token }}
          path: staged

      - name: Create annotated tag and official release with ONE APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s staged/TagTracker-v3.23.4.apk
          TESTED_SHA="f289a5875c1ce8d742cf475bc0c68e9a5c87a63f"
          if ! git ls-remote --exit-code --tags origin refs/tags/v3.23.4 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v3.23.4 "$TESTED_SHA" -m "Tag Tracker v3.23.4: APK unico versionado"
            git push origin refs/tags/v3.23.4
          fi
          if ! gh release view v3.23.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > notes.md <<'EOF'
          ## Tag Tracker v3.23.4

          - GitHub Releases e GitHub Actions distribuem apenas `TagTracker-vX.Y.Z.apk`, sem arquivo duplicado.
          - O verificador do aplicativo utiliza a ultima release e encontra o APK pelo nome da tag.
          - Mantem a identidade de assinatura Android permanente e a compatibilidade de dados na atualizacao.
          - Inclui fallback para downloads legados pelo nome antigo, quando houver.

          **Transicao unica para quem usa a v3.23.3:** instale manualmente `TagTracker-v3.23.4.apk` por cima do aplicativo, sem desinstalar. O atualizador da v3.23.3 ainda procura o nome antigo. Da v3.23.4 em diante a verificacao pelo aplicativo funciona com o nome versionado.
          EOF
            gh release create v3.23.4 staged/TagTracker-v3.23.4.apk --repo "$GITHUB_REPOSITORY" --verify-tag --title "Tag Tracker v3.23.4" --notes-file notes.md
          fi
          assets="$(gh release view v3.23.4 --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(",")')"
          test "$assets" = "TagTracker-v3.23.4.apk" || { echo "::error::A release 3.23.4 nao tem APK unico"; exit 1; }

      - name: Verify duplicates and remove only obsolete generic files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for v in 3.23.1 3.23.2 3.23.3; do
            versioned="TagTracker-v$v.apk"
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$v")"
            named_id="$(printf '%s' "$release_json" | jq -r --arg n "$versioned" '.assets[] | select(.name == $n) | .id')"
            named_hash="$(printf '%s' "$release_json" | jq -r --arg n "$versioned" '.assets[] | select(.name == $n) | .digest')"
            generic_id="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "TagTracker.apk") | .id')"
            generic_hash="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "TagTracker.apk") | .digest')"

            test -n "$named_id" && test -n "$named_hash" && test "$named_hash" != "null"
            if [ -n "$generic_id" ]; then
              test "$generic_hash" = "$named_hash" || { echo "::error::v$v generic APK differs from versioned APK"; exit 1; }
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$generic_id"
            fi
            final_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$v" --jq '[.assets[].name] | join(",")')"
            test "$final_names" = "$versioned" || { echo "::error::v$v still has unexpected assets: $final_names"; exit 1; }
            echo "Release v$v: one APK ($versioned), sha256: $named_hash"
          done
